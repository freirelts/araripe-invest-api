spring.application.name=araripe-invest-api
server.port=${SERVER_PORT:8080}

spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=${ARARIPE_MAIL_HEALTH_ENABLED:false}

araripe.integrations.brapi.base-url=${BRAPI_BASE_URL:https://brapi.dev/api}
araripe.integrations.brapi.timeout-seconds=${BRAPI_TIMEOUT_SECONDS:90}
araripe.integrations.brapi.retry-max-attempts=${BRAPI_RETRY_MAX_ATTEMPTS:3}
araripe.integrations.brapi.token=${BRAPI_API_TOKEN:${BRAPI_TOKEN:}}

araripe.security.allowed-origins=${ARARIPE_ALLOWED_ORIGINS:http://localhost:4200}
araripe.security.jwt.issuer=${ARARIPE_JWT_ISSUER:araripe-invest-api}
araripe.security.jwt.audience=${ARARIPE_JWT_AUDIENCE:araripe-invest-fed}
araripe.security.jwt.secret=${ARARIPE_JWT_SECRET:change-this-local-development-secret-with-at-least-32-bytes}
araripe.security.jwt.expiration=${ARARIPE_JWT_EXPIRATION:PT2H}
araripe.security.bootstrap-admin.enabled=${ARARIPE_BOOTSTRAP_ADMIN_ENABLED:false}
araripe.security.bootstrap-admin.email=${ARARIPE_BOOTSTRAP_ADMIN_EMAIL:}
araripe.security.bootstrap-admin.password=${ARARIPE_BOOTSTRAP_ADMIN_PASSWORD:}
araripe.security.bootstrap-admin.name=${ARARIPE_BOOTSTRAP_ADMIN_NAME:Administrador Araripe}

araripe.integrations.openai.model=${OPENAI_MODEL:gpt-5.6-luna}
araripe.integrations.openai.api-key=${OPENAI_API_KEY:}
araripe.integrations.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
araripe.integrations.openai.timeout-seconds=${OPENAI_TIMEOUT_SECONDS:30}
araripe.integrations.openai.enabled=${OPENAI_ENABLED:true}
araripe.integrations.openai.max-tokens=${OPENAI_MAX_TOKENS:2500}
araripe.integrations.openai.prompt-version=${OPENAI_PROMPT_VERSION:macro-sector-context-v1}
araripe.integrations.openai.web-search-model=${OPENAI_WEB_SEARCH_MODEL:gpt-5.4-mini}
araripe.integrations.openai.web-search-context-size=${OPENAI_WEB_SEARCH_CONTEXT_SIZE:medium}

araripe.notifications.email.from=${ARARIPE_MAIL_FROM:blueapps.saas@gmail.com}
araripe.notifications.email.reply-to=${ARARIPE_MAIL_REPLY_TO:blueapps.saas@gmail.com}

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE:false}
