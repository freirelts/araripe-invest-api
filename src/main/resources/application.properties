spring.application.name=araripe-invest-api
server.port=${SERVER_PORT:8080}

spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

araripe.integrations.brapi.base-url=${BRAPI_BASE_URL:https://brapi.dev/api}
araripe.integrations.brapi.timeout-seconds=${BRAPI_TIMEOUT_SECONDS:20}
araripe.integrations.brapi.retry-max-attempts=${BRAPI_RETRY_MAX_ATTEMPTS:3}
araripe.integrations.brapi.token=${BRAPI_API_TOKEN:${BRAPI_TOKEN:}}

araripe.integrations.aws.region=${AWS_REGION:sa-east-1}

araripe.security.allowed-origins=${ARARIPE_ALLOWED_ORIGINS:http://localhost:4200}
araripe.security.jwt.issuer=${ARARIPE_JWT_ISSUER:araripe-invest-api}
araripe.security.jwt.audience=${ARARIPE_JWT_AUDIENCE:araripe-invest-fed}
araripe.security.jwt.secret=${ARARIPE_JWT_SECRET:change-this-local-development-secret-with-at-least-32-bytes}
araripe.security.jwt.expiration=${ARARIPE_JWT_EXPIRATION:PT2H}
araripe.security.bootstrap-admin.enabled=${ARARIPE_BOOTSTRAP_ADMIN_ENABLED:false}
araripe.security.bootstrap-admin.email=${ARARIPE_BOOTSTRAP_ADMIN_EMAIL:}
araripe.security.bootstrap-admin.password=${ARARIPE_BOOTSTRAP_ADMIN_PASSWORD:}
araripe.security.bootstrap-admin.name=${ARARIPE_BOOTSTRAP_ADMIN_NAME:Administrador Araripe}

araripe.integrations.openai.model=${OPENAI_MODEL:gpt-4.1-mini}
araripe.integrations.openai.timeout-seconds=${OPENAI_TIMEOUT_SECONDS:30}

spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}
spring.ai.model.embedding=${SPRING_AI_MODEL_EMBEDDING:none}
spring.ai.model.image=${SPRING_AI_MODEL_IMAGE:none}
spring.ai.model.audio.speech=${SPRING_AI_MODEL_AUDIO_SPEECH:none}
spring.ai.model.audio.transcription=${SPRING_AI_MODEL_AUDIO_TRANSCRIPTION:none}
spring.ai.model.moderation=${SPRING_AI_MODEL_MODERATION:none}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4.1-mini}
