services:
  api:
    build:
      context: .
    image: araripe-invest-api:local
    container_name: araripe-invest-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: 8080
      ARARIPE_DB_HOST: postgres
      ARARIPE_DB_PORT: 5432
      ARARIPE_DB_NAME: ${ARARIPE_DB_NAME:-araripe_invest}
      ARARIPE_DB_USERNAME: ${ARARIPE_DB_USERNAME:-araripe}
      ARARIPE_DB_PASSWORD: ${ARARIPE_DB_PASSWORD:-araripe_local_password}
    ports:
      - "${ARARIPE_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: araripe-invest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ARARIPE_DB_NAME:-araripe_invest}
      POSTGRES_USER: ${ARARIPE_DB_USERNAME:-araripe}
      POSTGRES_PASSWORD: ${ARARIPE_DB_PASSWORD:-araripe_local_password}
    ports:
      - "${ARARIPE_DB_PORT:-5432}:5432"
    volumes:
      - araripe-invest-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  araripe-invest-postgres-data:
